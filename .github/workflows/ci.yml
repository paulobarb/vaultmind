name: CI

on:
  push:
    branches: 
        - main
  pull_request:
    branches: 
        - main

permissions:
  contents: read      
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyflakes

      - name: Check syntax (pyflakes)
        run: |
          pyflakes generate_insights.py
          pyflakes morning_briefing.py
          pyflakes study_recap.py
          pyflakes txt_to_notes.py
          pyflakes ai_backend.py
          pyflakes config.py